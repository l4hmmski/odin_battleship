<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Battleship</title><script defer src=main.js></script></head><body><header class=site-header><div><p class=eyebrow>Naval warfare<h1>Battleship</h1></div><button id=restart-button class=secondary-button type=button hidden>Play again</button></header><main><section class=game-status><p id=status-message>Loading game...<div class=scoreboard><div class=score><span>Player 1</span> <strong id=player-score>0</strong></div><span class=score-divider>—</span><div class=score><span>Computer</span> <strong id=computer-score>0</strong></div><button id=reset-score-button class=reset-score-button type=button>Reset score</button></div><div class=controls><button id=randomise-button class=secondary-button type=button>Randomise fleet</button> <button id=start-button class=primary-button type=button>Start battle</button></div></section><section class=boards><article class=board-section><div class=board-heading><div><p class=eyebrow>Friendly waters<h2>Your fleet</h2></div><span class=ship-key>Ships visible</span></div><div id=player-board class=gameboard aria-label="Your gameboard"></div></article><article class=board-section><div class=board-heading><div><p class=eyebrow>Enemy waters<h2>Computer fleet</h2></div><span class=attack-key>Select a target</span></div><div id=computer-board class="gameboard enemy-board" aria-label="Computer gameboard"></div></article></section><section class=legend><span><i class="legend-colour ship"></i> Ship </span><span><i class="legend-colour hit"></i> Hit </span><span><i class="legend-colour miss"></i> Miss</span></section></main><footer><p>Sink every enemy ship before the computer sinks yours.</footer></body></html>
